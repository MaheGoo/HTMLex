<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>ajout_vehicule</title>
</head>
<body bgcolor="#AEB8F1">

	<form action="#" method="post">

		<h1>Ajout d'un nouveau vehicule</h1>

		<table border="0" width="60%">

			<tr> <td>Marque</td>  
			<td> <label for="Marque"></label>
			<select id="marque" name="renault">
			<option opition value="renault">Renault</option>
			<option opition value="peugeot">Peugeot</option>
			<option opition value="citroen">Citroen </option>
			</select> 
			</td> </tr>

			<tr> <td>Immatriculation</td>  <td> 
			<label for="Immatriculation"></label>
			<input type="text" name="Immatriculation" id="Immatriculation"> </td> </tr>

			<tr> <td>Couleur</td> 
			<td> <label for="couleur"></label>
			<input type="text" name="couleur" id="couleur"> </td> </tr>

			<tr> <td>Date d'immatriculation</td>  
			<td><label for="date"></label>
			<input type="date" name="date" id="date"> </td> </tr>

			<tr> <td>Kilométrage</td> 
			<td> <label for="Kilométrage"></label>
			<input type="number" name="Kilometrage" id="Kilometrage"> </td> </tr>

			<tr> <td>Etat</td>  
			<td>
			<label for="Occasion">Occasion</label>
			<input type="radio" name="etat" value="non"> 
			<label for="marie_non">Neuf</label>
			<input type="radio" name="etat" value="non">
			</td> </tr>

			<tr> <td>Carburant</td>  
			<td>
			<label for="Carburant">Hybride</label>
			<input type="radio" name="Carburant" value="non"> 
			<label for="Carburant">Electrique</label>
			<input type="radio" name="Carburant" value="non">
			<label for="Carburant">Diesel</label>
			<input type="radio" name="Carburant" value="non">
			<label for="Carburant">Essence</label>
			<input type="radio" name="Carburant" value="non">
			</td> </tr>

			<tr> <td>Boîte de vitesse</td>  
			<td> <label for="Boite de vitesse"></label>
			<select id="btv" name="manuelle">
			<option opition value="manuelle">Manuelle</option>
			<option opition value="Automatique">Automatique</option>
			</select> 
			</td> </tr>

			<tr> <td>Nombre de portes</td> 
			<td> <label for="Nombre de portes"></label>
			<input type="number" name="Nombredeporte" id="Nombredeporte"> </td> </tr>

			<tr> <td>Finition</td>  
			<td> <label for="Finition"></label>
			<select id="Finition" name="full">
			<option opition value="full">Full package</option>
			<option opition value="Sport">Sportif</option>
			<option opition value="classique">Classique </option>
			</select> 
			</td> </tr>

			<tr> <td>Crit'air</td> 
			<td>
			<label for="Crit'air">1</label>
			<input type="radio" name="Carburant" value="non"> 
			<label for="Crit'air">2</label>
			<input type="radio" name="Carburant" value="non">
			<label for="Crit'air">3</label>
			<input type="radio" name="Carburant" value="non">
			<label for="Crit'air">4</label>
			<input type="radio" name="Carburant" value="non">
			<label for="Crit'air">5</label>
			<input type="radio" name="Carburant" value="non"> 
			
			</td> </tr>

		</table>

		<br>

		<button type="submit">Enregistrer</button>
		<button type="reset">Annuler</button>

	</form>

</body>
</html>
